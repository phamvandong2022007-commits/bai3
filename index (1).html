<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="product-list">
      <div class="product">
        <img src="anhmt/anhdell.jpg" alt="Sản phẩm 1" />
        <h2>Laptop ABC</h2>
        <p class="price">15.990.000 VNĐ</p>
        <p class="description">Laptop phù hợp cho học tập và lập trình.</p>
        <button class="buy-button">Mua ngay</button>
      </div>

      <div class="product">
        <img src="anhmt/anhmaytinh3.jpg" alt="Sản phẩm 2" />
        <h2>Laptop XYZ</h2>
        <p class="price">18.990.000 VNĐ</p>
        <p class="description">Laptop cấu hình tốt, phù hợp sinh viên CNTT.</p>
        <button class="buy-button">Mua ngay</button>
      </div>

      <div class="product">
        <img src="anhmt/anhmaytinh5.jpg" alt="Sản phẩm 3" />
        <h2>Laptop PRO</h2>
        <p class="price">22.990.000 VNĐ</p>
        <p class="description">Laptop hiệu năng cao cho lập trình và đồ họa.</p>
        <button class="buy-button">Mua ngay</button>
      </div>
    </div>
  </body>
</html>
